<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annambooks - Học Liệu Số</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Firebase SDK & Cấu hình trực tiếp từ tài khoản của mày -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvZzHsS8xklxzAXl5Zd2ZRVEWpdNgu-tY",
            authDomain: "annambooks-hoclieu.firebaseapp.com",
            projectId: "annambooks-hoclieu",
            storageBucket: "annambooks-hoclieu.firebasestorage.app",
            messagingSenderId: "249850173085",
            appId: "1:249850173085:web:f68e9bff4c581fa40b2674",
            measurementId: "G-EN9DQNG94H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Đưa ra biến toàn cục để phần giao diện gọi
        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
    </script>

    <style>
        :root {
            --primary-dark: #064e3b; /* Xanh lá đậm thương hiệu Annambooks */
            --primary-light: #f0fdf4;
            --accent-green: #059669;
        }
        body {
            background-color: var(--primary-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: var(--primary-dark);
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            background-color: var(--accent-green);
            color: white;
        }
        .btn-custom:hover {
            background-color: #047857;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-book-half me-2"></i>Annambooks - Học Liệu Số</a>
            <span class="text-white small"><i class="bi bi-cloud-check-fill text-info me-1"></i>Đã kết nối Đám mây</span>
        </div>
    </nav>

    <!-- Nội dung chính -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-4">
                <h2 class="fw-bold text-success mb-2">Kho Học Liệu Thông Minh Annambooks</h2>
                <p class="text-muted">Quản lý bài học và tài liệu trực tuyến, dữ liệu được lưu vĩnh viễn trên mây an toàn tuyệt đối!</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form thêm bài học (dành cho Admin) -->
            <div class="col-md-4">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-dark mb-3"><i class="bi bi-plus-circle me-2"></i>Thêm bài học mới</h5>
                    <form id="add-course-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên bài học / Học liệu</label>
                            <input type="text" id="course-title" class="form-control" placeholder="Ví dụ: Flashcard Tiếng Trung HSK 1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mô tả chi tiết / Link video</label>
                            <textarea id="course-desc" class="form-control" rows="3" placeholder="Nhập mô tả hoặc link Google Drive..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-custom w-100 fw-bold">Lưu lên mây</button>
                    </form>
                </div>
            </div>

            <!-- Danh sách hiển thị -->
            <div class="col-md-8">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-dark mb-3"><i class="bi bi-list-check me-2"></i>Danh sách học liệu trên đám mây</h5>
                    <div id="course-list" class="list-group">
                        <p class="text-muted text-center py-3">Đang kết nối tải dữ liệu...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xử lý dữ liệu với Firebase -->
    <script type="module">
        async function loadCourses() {
            const listContainer = document.getElementById('course-list');
            try {
                // Đợi một xíu cho Firebase khởi tạo xong
                if (!window.db) {
                    setTimeout(loadCourses, 500);
                    return;
                }
                const querySnapshot = await window.getDocs(window.collection(window.db, "hoclieu"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<div class="alert alert-info text-center m-0">Chưa có bài học nào trên đám mây. Hãy thêm bài học bên cạnh!</div>`;
                    return;
                }
                
                let html = '';
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    html += `
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="mb-1 fw-bold text-success">${data.title}</h6>
                                <p class="mb-0 text-muted small">${data.description || 'Không có mô tả'}</p>
                            </div>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1">Đã lưu vĩnh viễn</span>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (error) {
                console.error("Lỗi:", error);
                listContainer.innerHTML = `<div class="alert alert-danger text-center m-0">Chưa bật Firestore Database trong Firebase Console!</div>`;
            }
        }

        // Khi người dùng bấm nút thêm bài học
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadCourses, 1000);

            const form = document.getElementById('add-course-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('course-title').value;
                const description = document.getElementById('course-desc').value;

                try {
                    await window.addDoc(window.collection(window.db, "hoclieu"), {
                        title: title,
                        description: description,
                        createdAt: new Date().toISOString()
                    });
                    alert("Đã lưu bài học lên mây thành công!");
                    form.reset();
                    loadCourses(); // Tải lại danh sách
                } catch (error) {
                    alert("Lỗi khi lưu: " + error.message);
                }
            });
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
